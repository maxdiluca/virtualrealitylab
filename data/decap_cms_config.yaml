- name: bhamxr_map
  label: BhamXR expertise map
  editor:
    preview: false
  files:
  - name: members
    label: Members and research themes
    file: static/bhamxr-map/members.json
    format: json
    fields:
    - name: title
      label: Page title
      widget: string
    - name: intro
      label: Introduction
      widget: text
    - name: updated
      label: Last content update
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: false
      format: YYYY-MM-DD
    - name: groups
      label: Research themes
      widget: list
      collapsed: true
      allow_add: false
      summary: '{{fields.label}}'
      fields:
      - name: id
        label: Stable theme identifier
        widget: hidden
      - name: short
        label: Short label
        widget: string
      - name: label
        label: Full label
        widget: string
      - name: topics
        label: Topics
        widget: text
    - name: people
      label: Members
      widget: list
      collapsed: true
      summary: '{{fields.name}}'
      fields:
      - name: id
        label: Stable identifier
        widget: string
        hint: Unique lowercase name with hyphens, e.g. alex-smith. Keep unchanged
          after creation.
        pattern:
        - ^[a-z0-9]+(?:-[a-z0-9]+)*$
        - Use lowercase letters, numbers and hyphens.
      - name: name
        label: Full name
        widget: string
      - name: affiliation
        label: Affiliation
        widget: string
      - name: summary
        label: Research summary
        widget: text
      - name: interests
        label: Research interests
        widget: list
        field:
          name: interest
          label: Interest
          widget: string
      - name: methods
        label: Methods and expertise
        widget: list
        field:
          name: method
          label: Method
          widget: string
      - name: groups
        label: Research themes
        widget: select
        multiple: true
        options:
        - label: Perception, cognition & action
          value: perception
        - label: Health, rehabilitation & wellbeing
          value: health
        - label: Learning & professional training
          value: learning
        - label: Arts, heritage & performance
          value: culture
        - label: AI, robotics & engineering
          value: ai
        - label: Society, governance & inclusion
          value: society
        - label: Technical delivery, facilities & partnerships
          value: enabling
