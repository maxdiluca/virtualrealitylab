  - label: Publish this page on
    name: date
    widget: datetime
  - label: Summary
    name: summary
    widget: markdown
    required: false
  - label: Draft
    name: draft
    widget: boolean
    default: false
    required: false
  - label: Featured
    name: featured
    widget: boolean
    default: false
    required: false
  - label: Authors
    name: authors
    required: false
    widget: list
  - label: Tags
    name: tags
    required: false
    widget: list
  - label: Categories
    name: categories
    required: false
    widget: list
  - label: Projects
    name: projects
    required: false
    widget: list
  - label: Featured Image
    name: image
    required: false
    widget: object
    fields:
    - label: Upload an image named `featured.jpg/png`
      name: filename
      widget: image
      default: featured
      required: false
      media_library:
        config:
          multiple: false
    - label: Caption
      name: caption
      widget: string
      required: false
    - label: Description for screen readers
      name: alt_text
      widget: string
      required: false
    - label: Where's the focal point in the image? Smart, Center, TopLeft, Top, TopRight,
