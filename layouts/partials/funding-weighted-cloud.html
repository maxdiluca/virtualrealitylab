{{ $home := .home }}
{{ $cloud := .cloud }}
<svg class="funding-weighted-cloud" viewBox="0 0 {{ $cloud.width }} {{ $cloud.height }}" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Our funders and supporters">
  {{ range $cloud.items }}
    {{ $href := .href }}
    {{ if $home }}{{ $href = printf "/funding/%s" .href }}{{ end }}
    <a href="{{ $href }}" aria-label="{{ .name }}" class="funding-bubble" data-supporter="{{ .id }}">
      <title>{{ .name }}</title>
      <circle cx="{{ .x }}" cy="{{ .y }}" r="{{ .r }}" />
      {{ $size := mul .r 1.4 }}
      <image href="{{ .logo | relURL }}" x="{{ sub .x (div $size 2) }}" y="{{ sub .y (div $size 2) }}" width="{{ $size }}" height="{{ $size }}" preserveAspectRatio="xMidYMid meet" {{ if .dark_logo }}class="funding-white-mark"{{ end }} />
    </a>
  {{ end }}
</svg>
